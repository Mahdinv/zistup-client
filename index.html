<!doctype html>

<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA icon for Apple devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/pwa/apple-touch-icon-180.png"
    />
    <!-- PWA / browser theme -->
    <meta name="theme-color" content="#21262d" />
    <meta
      name="description"
      content="زیست‌آپ؛ همراه شما برای تغذیه سالم‌تر و انتخاب‌های غذایی بهتر"
    />
    <!-- Existing startup logo -->
    <link
      rel="preload"
      href="/startup-logo.svg"
      as="image"
      type="image/svg+xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>زیست‌آپ</title>
    <style>
      #startup-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100dvh;
        background: #ffffff;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 300ms ease,
          visibility 300ms ease;
      }

      #startup-screen__logo {
        display: block;
        width: clamp(180px, 45vw, 240px);
        height: auto;
        animation:
          startup-logo-enter 550ms cubic-bezier(0.22, 1, 0.36, 1) both,
          startup-logo-breathe 1600ms ease-in-out 550ms infinite alternate;
      }
      #startup-screen.startup-screen--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes startup-logo-enter {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes startup-logo-breathe {
        from {
          transform: scale(0.985);
        }
        to {
          transform: scale(1.015);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-screen {
          transition: none;
        }
        #startup-screen__logo {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-screen" aria-hidden="true">
      <img id="startup-screen__logo" src="/startup-logo.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
